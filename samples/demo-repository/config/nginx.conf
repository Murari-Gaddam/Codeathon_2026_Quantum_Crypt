# API Gateway Nginx Configuration
# Reverse proxy terminating TLS for external clients

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # SSL / TLS Configuration
    # Potential migration concern: Legacy TLS 1.2 enabled alongside TLS 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Public certificate and private key location
    ssl_certificate /etc/ssl/certs/server.pem;
    ssl_certificate_key /etc/ssl/private/server.key;

    server {
        listen 443 ssl http2;
        server_name api.enterprise.internal;

        location /auth/ {
            proxy_pass http://authentication-service:8000;
        }

        location /api/ {
            proxy_pass http://api-gateway:8080;
        }
    }
}
