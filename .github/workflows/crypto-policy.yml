name: Cryptographic Governance & PQC Policy Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  crypto-policy-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run PQC Migration Scanner
      run: |
        python backend/cli.py scan . \
          --policy rules/policies.json \
          --output-json scan-results.json \
          --output-html scan-report.html

    - name: Upload Scan Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pqc-crypto-governance-report
        path: |
          scan-results.json
          scan-report.html
